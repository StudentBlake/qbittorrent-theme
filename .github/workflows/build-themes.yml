name: Build qBittorrent themes

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.11.2
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.2"
          host: linux
          target: desktop
          cache: true

      - name: Locate rcc
        run: |
          RCC=$(find "$QT_ROOT_DIR" -type f -name rcc -perm -u+x | head -n1)
          test -n "$RCC"
          echo "RCC=$RCC" >> "$GITHUB_ENV"
          "$RCC" --version

      - name: Build themes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir dist
          for qrc in src/catppuccin-*/resources.qrc; do
            flavor=$(basename "$(dirname "$qrc")")
            "$RCC" --binary --compress-algo zlib "$qrc" -o "dist/${flavor}.qbtheme"
            echo "Built dist/${flavor}.qbtheme"
          done
          ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qbittorrent-themes
          path: dist/*.qbtheme
          if-no-files-found: error

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.qbtheme
          generate_release_notes: true
