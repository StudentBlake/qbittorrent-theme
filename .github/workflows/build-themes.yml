name: Build qBittorrent themes

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt5 rcc
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev-tools
          echo "/usr/lib/qt5/bin" >> "$GITHUB_PATH"

      - name: Install whiskers
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Install whiskers binary
        run: cargo binstall -y --locked catppuccin-whiskers

      - name: Render templates
        run: |
          # TODO: replace with your repo's real render command
          # (check the README or justfile), for example:
          # whiskers templates/<file>.tera
          echo "render step goes here"

      - name: Build themes
        run: |
          chmod +x tools/build
          tools/build
          ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qbittorrent-themes
          path: dist/*.qbtheme
          if-no-files-found: error

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.qbtheme
          generate_release_notes: true
